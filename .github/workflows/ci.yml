name: Python lakehouse CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests
        run: python -m pip install 'pytest>=8,<10'
      - name: Syntax validation
        run: python -m compileall -q src integrations tests scripts
      - name: Verify deterministic ETL and REST ingestion
        run: python -m pytest -q
